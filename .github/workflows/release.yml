name: Release

# Publishes to npm when a GitHub release is published. Uses npm's trusted
# publishing (OIDC), so no token is stored in the repository: the package's npm
# settings must list this repository and workflow as a trusted publisher.
# See docs/releasing.md.
#
# Two jobs. `build` installs, tests, and packs with read-only access, so no
# dependency's code runs anywhere it could publish or move tags. `publish`
# installs nothing: it attests, publishes, and attaches the tarball `build` made.

on:
  release:
    types: [published]

permissions:
  contents: read

# One release at a time: a second one waits instead of racing the first to npm.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      file: ${{ steps.pack.outputs.file }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check the release commit is on main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Check the release
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(node -p "require('./package.json').version")
          private=$(node -p "require('./package.json').private === true")
          if [ "$TAG" = "$version" ]; then echo "::error::Release tags start with v: delete this release and its tag, then create the release v$version."; exit 1; fi
          if [ "$TAG" != "v$version" ]; then echo "::error::Release tag $TAG doesn't match package.json version $version: it should be v$version."; exit 1; fi
          if [ "$private" = "true" ]; then echo "::error::package.json is still marked private."; exit 1; fi
          case "$version" in
            *-*) if [ "$PRERELEASE" != "true" ]; then echo "::error::$version is a prerelease version: mark the GitHub release as a pre-release."; exit 1; fi ;;
            *) if [ "$PRERELEASE" = "true" ]; then echo "::error::$version isn't a prerelease version, but the GitHub release is marked as a pre-release."; exit 1; fi ;;
          esac
          # Only reviewed code is released: the tag must point at a commit on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "::error::The release commit isn't on main. Create the release from main."; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packed once: the same bytes are attested, published, and attached to the release.
      - name: Pack
        id: pack
        shell: bash
        run: echo "file=$(npm pack | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the package to the release, and move the v0 tag
      id-token: write # npm trusted publishing and provenance, and signing the attestation
      attestations: write # store the attestation, so `gh attestation verify` finds it
    steps:
      # For moving the v0 tag. Nothing from the checkout runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Attest the package
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.file }}
      - name: Publish
        shell: bash
        env:
          FILE: ${{ needs.build.outputs.file }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # The first version was published by hand (docs/releasing.md), and a re-run finds its own.
          if npm view "permlang@$VERSION" version > /dev/null 2>&1; then echo "permlang@$VERSION is already on npm."; exit 0; fi
          tag=latest
          if [ "$PRERELEASE" = "true" ]; then tag=next; fi
          if ! out=$(npm publish "./$FILE" --access public --tag "$tag" 2>&1); then
            echo "$out"
            # npm can take minutes to show a new version, so a re-run may not have seen it above.
            if grep -qiE "cannot publish over|previously published" <<< "$out"; then echo "permlang@$VERSION is already on npm."; exit 0; fi
            exit 1
          fi
          echo "$out"
      - name: Attach the package and its provenance to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          FILE: ${{ needs.build.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The Sigstore bundle, which `gh attestation verify --bundle` and cosign read, and the
          # signed SLSA provenance inside it (a DSSE envelope), as in-toto JSON Lines.
          cp "$BUNDLE" "$FILE.sigstore.json"
          node -e 'const [b] = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n"); console.log(JSON.stringify(JSON.parse(b).dsseEnvelope))' "$BUNDLE" > "$FILE.intoto.jsonl"
          gh release upload "$TAG" "$FILE" "$FILE.sigstore.json" "$FILE.intoto.jsonl" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Point the v0 tag at this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$TAG" in v0.*) ;; *) echo "Not a v0 release; leaving the v0 tag alone."; exit 0 ;; esac
          if [ "$PRERELEASE" = "true" ]; then echo "A pre-release; leaving the v0 tag alone."; exit 0; fi
          # Only the newest release moves v0, so re-running an older one can't move it back.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" != "$TAG" ]; then echo "The latest release is $latest, not $TAG; leaving the v0 tag alone."; exit 0; fi
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin v0
