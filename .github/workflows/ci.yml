name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24, 26]
        include:
          # Development happens on Windows; keep path handling honest there too.
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Without install scripts, as the release build runs it, so what passes here is what ships.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        shell: bash
        run: |
          node dist/cli.js check fixtures/m1/pass --no-lock
          # The fail fixtures must make the CLI exit 1.
          set +e; node dist/cli.js check fixtures/m1/fail --no-lock > /dev/null; code=$?; set -e
          test "$code" -eq 1

  # The lint rules in eslint.config.js, which read types, so they run once: they don't change
  # between platforms.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # The software bill of materials each release gets (release.yml), made and checked against
  # package-lock.json here too, so a change that breaks it shows up before a release does.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run sbom -- permlang.cdx.json

  # Builds and packs the package twice, from scratch each time, and compares the two: the same
  # source must give the same bytes, so anyone can rebuild a release from its tag and compare
  # it with what's on npm (SECURITY.md).
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build and pack twice
        shell: bash
        run: |
          npm run build && first=$(npm pack | tail -n 1) && mv "$first" "first-$first"
          npm run build && second=$(npm pack | tail -n 1)
          sha256sum "first-$first" "$second"
          cmp "first-$first" "$second"

  # Measures what the tests cover and uploads it to Codecov, for the README badge. A job of
  # its own, so only it can get the OIDC token Codecov signs in with (no stored secret).
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign in to Codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Without install scripts, as the release build runs it, so what passes here is what ships.
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      # Pull requests from forks get no OIDC token, so a failed upload doesn't fail the job.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
