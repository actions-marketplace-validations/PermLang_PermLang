name: PermLang
description: Fail pull requests that give TypeScript code new access to servers, files, secrets, databases, AI tools, or CI permissions.
author: PermLang
branding:
  icon: shield
  color: blue

inputs:
  args:
    description: Arguments for `permlang check`, such as source paths or `--project tsconfig.json`.
    required: false
    default: ""
  strictness:
    description: sketch, development, or production. Overrides permlang.config.json.
    required: false
    default: ""
  working-directory:
    description: Directory containing the code, permlang.config.json, and permlang.lock.json.
    required: false
    default: "."
  comment:
    description: Post the permission diff as a pull-request comment (updated in place on later pushes).
    required: false
    default: "true"
  github-token:
    description: "Token for posting the comment. Needs `pull-requests: write` permission."
    required: false
    default: ${{ github.token }}
  sarif:
    description: "Also upload the findings to GitHub code scanning (the Security tab). Needs `security-events: write` permission."
    required: false
    default: "false"

outputs:
  exit-code:
    description: The exit code of `permlang check` (0 no errors, 1 permission errors, 2 configuration error).
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    # The build is cached, keyed on PermLang's own sources, so only the first run
    # for each PermLang version installs and compiles. (hashFiles() only works inside
    # the workspace, and the action's files are outside it, so the key is computed here.)
    # actions/cache rejects paths containing `.` segments, and github.action_path is
    # `<workspace>/./` when the action runs from its own repository (`uses: ./`), so
    # the cached paths use the directory's resolved absolute path.
    - name: Compute build cache key
      id: build-key
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # sha256sum on Linux and Windows runners, shasum on macOS.
        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
        hash=$(cat package-lock.json tsconfig.json tsconfig.build.json $(find src -name '*.ts' | sort) | "${sha[@]}" | cut -c1-16)
        echo "key=permlang-build-${{ runner.os }}-node22-$hash" >> "$GITHUB_OUTPUT"
        echo "dir=$(pwd -P)" >> "$GITHUB_OUTPUT"

    - name: Restore the build
      id: build-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.build-key.outputs.dir }}/node_modules
          ${{ steps.build-key.outputs.dir }}/dist
        key: ${{ steps.build-key.outputs.key }}

    - name: Build PermLang
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund && npm run build

    - name: Save the build
      if: steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.build-key.outputs.dir }}/node_modules
          ${{ steps.build-key.outputs.dir }}/dist
        key: ${{ steps.build-key.outputs.key }}

    - name: Check permissions
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        STRICTNESS: ${{ inputs.strictness }}
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        extra=()
        [ -n "$STRICTNESS" ] && extra+=(--strictness "$STRICTNESS")
        [ "$SARIF" = "true" ] && extra+=(--sarif "$RUNNER_TEMP/permlang.sarif")
        # Annotations put each problem on its line in the pull request's "Files changed" tab.
        node "$PERMLANG" check $ARGS "${extra[@]}" --github-annotations
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload to code scanning
      if: inputs.sarif == 'true'
      # Best effort, like the comment: a missing permission or a fork's read-only token
      # mustn't fail the job. The check result decides that.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/permlang.sarif
        category: permlang

    - name: Comment the permission diff
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        ARGS: ${{ inputs.args }}
      run: |
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        if [ ! -f permlang.lock.json ]; then
          echo "No permlang.lock.json; run \`permlang lock\` and commit it to get a permission diff."
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        # The same source selection as the check, so "Where it happens" can be filled in.
        node "$PERMLANG" diff "$BASE_SHA" $ARGS --format markdown > "$RUNNER_TEMP/permlang-diff.md"
        cat "$RUNNER_TEMP/permlang-diff.md" >> "$GITHUB_STEP_SUMMARY"

        # A pull request from a fork gets a read-only token: the diff stays in the job summary.
        if [ "$HEAD_REPO" != "$REPO" ]; then
          echo "::notice::Pull request from a fork: the permission diff is in the job summary."
          exit 0
        fi

        # Posting is best effort: the check result, not the comment, decides the job.
        set +e
        body="$(cat "$RUNNER_TEMP/permlang-diff.md")"
        # Only a bot's comment counts: anyone can post a comment with the same marker,
        # and editing (or leaving standing) a planted one would show a fake diff.
        existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq '.[] | select(.user.type == "Bot" and (.body | startswith("<!-- permlang-diff -->"))) | .id' | head -1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
        fi
        if [ $? -ne 0 ]; then
          echo "::warning::Couldn't post the permission diff comment (the token needs pull-requests: write). It's in the job summary."
        fi

    - name: Fail on permission errors
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
