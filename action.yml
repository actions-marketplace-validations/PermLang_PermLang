name: PermLang
description: Fail pull requests that give TypeScript code new access to servers, files, secrets, databases, or CI. Flag risky AI tools.
author: PermLang
branding:
  icon: shield
  color: blue

inputs:
  args:
    description: Arguments for `permlang check`, such as source paths or `--project tsconfig.json`, split on spaces. The lock file records them, so changing them needs `permlang lock` with the same arguments. An option `check` doesn't take is an error.
    required: false
    default: ""
  strictness:
    description: sketch, development, or production. Overrides permlang.config.json, and like it, is recorded in the lock file.
    required: false
    default: ""
  working-directory:
    description: Directory containing the code, permlang.config.json, and permlang.lock.json.
    required: false
    default: "."
  comment:
    description: Post the permission diff as a pull-request comment (updated in place on later pushes).
    required: false
    default: "true"
  github-token:
    description: "Token for posting the comment. Needs `pull-requests: write` permission."
    required: false
    default: ${{ github.token }}
  sarif:
    description: "Also upload the findings to GitHub code scanning (the Security tab). Needs `security-events: write` permission."
    required: false
    default: "false"
  dependencies:
    description: The name of an artifact, uploaded by an earlier job, holding a tar archive of the project's node_modules folders, which the check reads types from. Installing runs code the pull request controls, so it belongs in another job; only node_modules folders (and the generated folders named) come in from it, as new folders.
    required: false
    default: ""
  generated:
    description: Folders, from the repository root and split on spaces, that the installing job generated outside node_modules (such as a Prisma client in src/generated) and packed too. They mustn't be in the checkout.
    required: false
    default: ""

outputs:
  exit-code:
    description: The exit code of `permlang check` (0 no errors, 1 permission errors, 2 anything else, such as a usage or configuration error).
    value: ${{ steps.check.outputs.exit-code }}

runs:
  using: composite
  steps:
    # PermLang runs on Node 22, called by its full path, so the Node that later steps of your job
    # use doesn't change. GitHub-hosted runners have Node 22 in their tool cache. Elsewhere,
    # actions/setup-node installs it, and (as it always does) puts it first on the PATH.
    - name: Find Node
      id: cached-node
      shell: bash
      run: |
        cache="$RUNNER_TOOL_CACHE"
        # Git Bash on Windows needs the cache's path in its own form for the glob below.
        if [ "$RUNNER_OS" = Windows ] && [ -n "$cache" ]; then cache=$(cygpath -u "$cache"); fi
        arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        best=""
        for complete in "$cache"/node/22.*/"$arch".complete; do
          [ -f "$complete" ] || continue
          version=$(basename "$(dirname "$complete")")
          best=$(printf '%s\n%s\n' "$best" "$version" | sed '/^$/d' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)
        done
        node=""
        if [ -n "$best" ]; then
          for candidate in "$cache/node/$best/$arch/bin/node" "$cache/node/$best/$arch/node.exe"; do
            if [ -x "$candidate" ] && "$candidate" --version > /dev/null 2>&1; then
              node="$candidate"
              break
            fi
          done
        fi
        echo "path=$node" >> "$GITHUB_OUTPUT"

    - name: Set up Node
      if: steps.cached-node.outputs.path == ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        # PermLang's own build is cached below. Caching your package manager's files isn't
        # needed, and fails in some monorepos (a packageManager field and no root lockfile).
        package-manager-cache: false

    - name: Locate Node
      id: node
      shell: bash
      env:
        CACHED: ${{ steps.cached-node.outputs.path }}
      run: |
        node="${CACHED:-$(command -v node)}"
        "$node" --version
        echo "path=$node" >> "$GITHUB_OUTPUT"

    # The build is cached, keyed on PermLang's own sources, so only the first run
    # for each PermLang version installs and compiles. (hashFiles() only works inside
    # the workspace, and the action's files are outside it, so the key is computed here.)
    # actions/cache rejects paths containing `.` segments, and github.action_path is
    # `<workspace>/./` when the action runs from its own repository (`uses: ./`), so
    # the cached paths use the directory's resolved absolute path.
    #
    # Only on a push, or a scheduled or manual run, though. For a pull request or a merge
    # queue entry, GitHub looks first in that pull request's own cache, which any job that
    # runs for it can write to: the pull request's code (its tests, say) could put a build of
    # its own there under this key, which would then run instead of PermLang. So there,
    # PermLang is built from its sources and lockfile every time, and the build isn't saved.
    # (GHSA-2vhg-398w-7p59)
    - name: Compute build cache key
      if: contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
      id: build-key
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # sha256sum on Linux and Windows runners, shasum on macOS.
        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi
        hash=$(cat package-lock.json tsconfig.json tsconfig.build.json $(find src -name '*.ts' | sort) | "${sha[@]}" | cut -c1-16)
        echo "key=permlang-build-${{ runner.os }}-node22-$hash" >> "$GITHUB_OUTPUT"
        # actions/cache reads the path as a Windows path there: Git Bash's /d/a/... would
        # name a folder that doesn't exist, and nothing would be saved.
        if [ "$RUNNER_OS" = Windows ]; then echo "dir=$(cygpath -m "$(pwd -P)")" >> "$GITHUB_OUTPUT"; else echo "dir=$(pwd -P)" >> "$GITHUB_OUTPUT"; fi

    - name: Restore the build
      if: steps.build-key.outputs.key != ''
      id: build-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.build-key.outputs.dir }}/node_modules
          ${{ steps.build-key.outputs.dir }}/dist
        key: ${{ steps.build-key.outputs.key }}

    - name: Build PermLang
      if: steps.build-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        NODE: ${{ steps.node.outputs.path }}
      run: |
        # This step's own PATH only: npm, and the build it runs, use PermLang's Node.
        PATH="$(dirname "$NODE"):$PATH"
        npm ci --ignore-scripts --no-audit --no-fund && npm run build

    - name: Save the build
      if: steps.build-key.outputs.key != '' && steps.build-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.build-key.outputs.dir }}/node_modules
          ${{ steps.build-key.outputs.dir }}/dist
        key: ${{ steps.build-key.outputs.key }}

    # The packages another job installed, for the check to read their types. Installing runs code
    # the pull request controls, even with install scripts off (a package manager's settings and
    # plugins can), and code that runs in this job before the check could change what it runs or
    # reports. So it happens in a job of its own, which packs every node_modules folder, and only
    # those folders (and the generated folders named) come in from its archive, as new folders,
    # with links that stay in the repository (src/dependencies.ts). (GHSA-chh9-p8fq-3gf9)
    - name: Download the dependencies
      id: download
      if: inputs.dependencies != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.dependencies }}
        path: ${{ runner.temp }}/permlang-dependencies

    # The check's job runs even when the job that installs fails (`if: always()`), so that it fails
    # too: a job skipped because a job it needs failed counts as passed. (GHSA-86ff-3f4h-rrjp)
    - name: Explain the missing dependencies
      if: failure() && steps.download.outcome == 'failure'
      shell: bash
      run: echo "::error::There are no dependencies to download, so PermLang can't check this code. The job that installs them may have failed; see its log."

    - name: Import the dependencies
      if: inputs.dependencies != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NODE: ${{ steps.node.outputs.path }}
        IMPORT: ${{ github.action_path }}/dist/import-dependencies.js
        GENERATED: ${{ inputs.generated }}
      run: |
        set -f  # GENERATED is split on spaces, like a command line, but never glob-expanded.
        "$NODE" "$IMPORT" "$RUNNER_TEMP/permlang-dependencies" "$RUNNER_TEMP" $GENERATED

    # Deleting the lock file, or pointing the check at another one, mustn't turn it off. On a
    # pull request (or merge queue entry), the check compares with the base commit (--base): it
    # requires the lock file when the base has it, and fails when the change stops checking with
    # the base's lock. PermLang reads `args` for that itself, as the check will. When the base
    # can't be fetched, the lock is required anyway.
    - name: Look up the base commit
      id: base
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE: ${{ steps.node.outputs.path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        TOKEN: ${{ inputs.github-token }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        fetched=false
        if [ -n "$BASE_SHA" ]; then
          # A full clone (fetch-depth: 0) has it already, and fetching it with --depth would make
          # the clone shallow. A shallow one fetches just that commit.
          if git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null; then
            fetched=true
          else
            depth=()
            [ "$(git rev-parse --is-shallow-repository)" = true ] && depth=(--depth=1)
            # A checkout that didn't keep its token (persist-credentials: false, as in the workflow
            # init writes) can't fetch from a private repository. Then the Action's token goes to
            # this one fetch, in a header, and is kept nowhere.
            # (The first try's error is shown only when there's no second.)
            header() { printf 'AUTHORIZATION: basic %s' "$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"; }
            fetch() { git "$@" fetch --no-tags "${depth[@]}" origin "$BASE_SHA"; }
            if { [ -z "$TOKEN" ] && fetch; } || { [ -n "$TOKEN" ] && { fetch 2> /dev/null || fetch -c "http.extraheader=$(header)"; }; }; then
              fetched=true
            else
              echo "::warning::Couldn't fetch the base commit, so a missing lock file fails the check, and the permission diff can't be shown."
            fi
          fi
        fi
        # This folder, from the repository root: it tells apart several runs on one pull request.
        folder=$("$NODE" -e 'const p = require("path"); process.stdout.write(p.relative(process.env.GITHUB_WORKSPACE || ".", ".").split(p.sep).join("/").replace(/[\x00-\x1f]/g, ""))')
        {
          echo "fetched=$fetched"
          echo "sarif-category=permlang${folder:+/$folder}"
        } >> "$GITHUB_OUTPUT"

    - name: Check permissions
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE: ${{ steps.node.outputs.path }}
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        STRICTNESS: ${{ inputs.strictness }}
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        FETCHED: ${{ steps.base.outputs.fetched }}
      run: |
        set +e
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        extra=()
        [ -n "$STRICTNESS" ] && extra+=(--strictness "$STRICTNESS")
        if [ "$FETCHED" = "true" ]; then
          extra+=(--base "$BASE_SHA")
        elif [ -n "$BASE_SHA" ]; then
          extra+=(--require-lock)
        fi
        [ "$SARIF" = "true" ] && extra+=(--sarif "$RUNNER_TEMP/permlang.sarif")
        # Annotations put each problem on its line in the pull request's "Files changed" tab.
        "$NODE" "$PERMLANG" check $ARGS "${extra[@]}" --github-annotations
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload to code scanning
      if: inputs.sarif == 'true'
      # Best effort, like the comment: a missing permission or a fork's read-only token
      # mustn't fail the job. The check result decides that.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/permlang.sarif
        # One category per folder, so runs for several folders don't replace each other's alerts.
        category: ${{ steps.base.outputs.sarif-category }}

    - name: Comment the permission diff
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE: ${{ steps.node.outputs.path }}
        PERMLANG: ${{ github.action_path }}/dist/cli.js
        GH_TOKEN: ${{ inputs.github-token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        ARGS: ${{ inputs.args }}
        STRICTNESS: ${{ inputs.strictness }}
        CHECK_EXIT: ${{ steps.check.outputs.exit-code }}
      run: |
        # Failures here are warnings, except one: a comment that can't be updated would go on
        # showing an earlier push's diff as if it were current.
        set +e
        set -f  # ARGS is split on spaces, like a command line, but never glob-expanded.
        body="$RUNNER_TEMP/permlang-diff.md"
        summary="$RUNNER_TEMP/permlang-summary.md"
        rm -f "$summary"
        extra=()
        [ -n "$STRICTNESS" ] && extra+=(--strictness "$STRICTNESS")
        # The same files and settings as the check. When the diff fails, this still prints a
        # comment that says so. The job summary takes far more than a comment: it gets the diff uncut.
        "$NODE" "$PERMLANG" diff "$BASE_SHA" $ARGS "${extra[@]}" --format markdown --summary "$summary" > "$body"
        status=$?
        # No lock file in the pull request or at its base: there's nothing to compare, so this
        # only replaces an earlier comment of this run's, which would no longer apply.
        no_lock=false
        if [ "$(tail -n 1 "$body")" = "<!-- permlang-status: no-lock -->" ]; then
          no_lock=true
          echo "No lock file here or at the base commit; run \`permlang lock\` and commit it to get a permission diff."
        elif [ "$status" -ne 0 ]; then
          echo "::warning::Couldn't compute the permission diff (see the error above). The comment says so."
        fi
        # Even a diff that fails prints a comment saying so; nothing at all means it died (out of
        # memory, or stopped), and an earlier push's comment would go on looking current.
        if [ ! -s "$body" ]; then
          echo "::error::PermLang's diff printed nothing (exit code $status), so the pull request's comment can't be updated, and may still show an earlier push's diff."
          exit 1
        fi
        # A check that stopped with an error (exit code 2, such as for an option it doesn't take
        # that diff does) compared nothing, whatever the diff shows: the comment says so first,
        # after its marker and heading.
        if [ "$CHECK_EXIT" = 2 ] && [ "$no_lock" != true ]; then
          stopped="> **PermLang's check stopped with an error**, so it compared nothing, and the pull request fails until that's fixed. The job log has the details. The diff below may not be what the check would find."
          for file in "$body" "$summary"; do
            [ -s "$file" ] || continue
            { head -n 2 "$file"; printf '\n%s\n%s\n' '> [!CAUTION]' "$stopped"; tail -n +3 "$file"; } > "$file.tmp" && mv "$file.tmp" "$file"
          done
        fi
        if [ -s "$summary" ]; then
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        elif [ "$no_lock" != true ]; then
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
        fi

        # A pull request from a fork gets a read-only token: the diff stays in the job summary.
        if [ "$HEAD_REPO" != "$REPO" ]; then
          [ "$no_lock" = true ] || echo "::notice::Pull request from a fork: the permission diff is in the job summary."
          exit 0
        fi

        # The comment to update is this run's (its first line is the marker, which names the
        # folder), posted by this token's own account: github-actions[bot] for the default
        # token, or a personal token's owner. Anyone can post a comment with the marker, and
        # editing (or leaving standing) a planted one would show a fake diff.
        me=$(gh api graphql -f query='query { viewer { login } }' --jq .data.viewer.login 2> /dev/null)
        [ -n "$me" ] || me=$(gh api user --jq .login 2> /dev/null)
        [ -n "$me" ] || me="github-actions"
        # The REST API names an app's account <app>[bot]; GraphQL leaves the suffix off.
        me="${me%\[bot\]}"
        marker=$(head -n 1 "$body")
        comments=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[] | [.id, .user.login, (.body | split("\n") | .[0])] | @tsv')
        if [ $? -ne 0 ]; then
          echo "::warning::Couldn't list the pull request's comments, so the permission diff can't be posted. It's in the job summary."
          exit 0
        fi
        existing=""
        while IFS=$'\t' read -r id login first; do
          if { [ "$login" = "$me" ] || [ "$login" = "$me[bot]" ]; } && [ "$first" = "$marker" ]; then
            existing="$id"
            break
          fi
        done <<< "$comments"
        if [ "$no_lock" = true ] && [ -z "$existing" ]; then exit 0; fi

        # The body goes in a file: a long one doesn't fit on a command line.
        request="$RUNNER_TEMP/permlang-comment.json"
        "$NODE" -e 'process.stdout.write(JSON.stringify({ body: require("fs").readFileSync(process.argv[1], "utf8") }))' "$body" > "$request"
        if [ -n "$existing" ]; then
          if ! gh api --method PATCH "repos/$REPO/issues/comments/$existing" --input "$request" > /dev/null; then
            echo "::error::Couldn't update the permission diff comment, which still shows an earlier push's diff. The current diff is in the job summary."
            exit 1
          fi
        elif ! gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input "$request" > /dev/null; then
          echo "::warning::Couldn't post the permission diff comment (the token needs pull-requests: write). It's in the job summary."
        fi

    - name: Fail on permission errors
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$CODE"
